<body class="adm">
<main id="login" class="login" hidden>

<h1>Konsol Polsek Kapuas Tengah</h1>
<label for="code">Kode akses</label>
<input id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" required>

<button class="btn btn-gold" type="submit">Masuk</button>
<p class="hint">Kode akses diberikan oleh Kapolsek atau Owner. Kode bisa dicabut dan dibuat ulang kapan saja.</p>
</form>
</main>

<div id="app" hidden>

<button type="button" data-v="bookings">Booking</button>

</nav>
<div class="who"><span id="who"></span><button type="button" id="logout">Keluar</button></div>
</header>
<section class="view" id="view" aria-live="polite"></section>
</div>

<div class="body"><form class="form" id="edit-f" novalidate></form></div>

<div id="toast" role="status"></div>
